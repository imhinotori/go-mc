name = "vanilla_skeleton"
version = "0.1.0"
entrypoint = "main.star"
runtime = "starlark"
# Least-privilege caps (24-RESEARCH Security Domain / T-24-07). The skeleton's COMBAT goals are Go-NATIVE
# (kind="melee_attack"/"hurt_by_target"/"nearest_attackable_target", 35-01b): the target acquire
# (setTarget), the chase (navigation.moveTo), and the melee-hit (doHurtTarget — the player damage) are
# HOST-side ops the Go-native goals own — NOT plugin ops — so the .star needs NO widened cap for combat.
# (The bow/ranged path is DEFERRED — v1 is melee-only; the .star never fires a projectile.)
# The .star (the PASSIVE goals) reads its own state + the nearest player and writes its look + nav want:
#   entities.read  — read x/y/z + the rng draws (the stroll/look gates) + the look-state scratch
#   entities.write — set_look_at (LookControl.setLookAt) + set_state (the passive goal scratch)
#   world.read     — nearest_player (LookAtPlayerGoal getNearestPlayer)
#   nav            — path_to/has_path/stop (WaterAvoidingRandomStrollGoal navigation)
capabilities = ["entities.read", "entities.write", "world.read", "nav"]
