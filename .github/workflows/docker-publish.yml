# Build + publish the Sulfur server image to GHCR (public).
#   development branch -> :latest (rolling)
#   main branch        -> :stable
# Each push also gets an immutable :sha-<commit> tag. After publishing :latest we prune
# all but the 3 newest untagged/latest images to bound storage.
name: docker-publish

on:
  push:
    branches: [development, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # imhinotori/sulfur

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # development -> latest ; main -> stable. Both get an immutable sha tag.
      - name: Compute tags
        id: tags
        run: |
          REPO_LC="$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            CHANNEL="stable"
          else
            CHANNEL="latest"
          fi
          {
            echo "image=${REGISTRY}/${REPO_LC}"
            echo "channel=${CHANNEL}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.channel }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # Keep at most 3 versions to bound GHCR storage. Runs after a successful publish.
  prune:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Prune old image versions (keep 3 most recent)
        uses: actions/delete-package-versions@v5
        with:
          package-name: sulfur
          package-type: container
          min-versions-to-keep: 3
          # Keep the channel tags alive; only prune older sha-tagged/untagged versions.
          ignore-versions: '^(latest|stable)$'
