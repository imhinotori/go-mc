name = "vanilla_iron_golem"
version = "0.1.0"
entrypoint = "main.star"
runtime = "starlark"
# Least-privilege caps: the golem's COMBAT/target goals are Go-NATIVE (kind=) — the target acquire, the
# chase, the melee + the doHurtTarget damage/fling are HOST-side ops the Go-native goals own, so the .star
# needs NO widened cap for combat. The .star (the passive goals: stroll/look/around) reads its own state +
# the nearest player and writes its look + nav want:
#   entities.read  — read x/y/z + the rng draws (the stroll/look gates) + the look-state scratch
#   entities.write — set_look_at (LookControl.setLookAt) + set_state (the passive goal scratch)
#   world.read     — nearest_player (LookAtPlayerGoal getNearestPlayer)
#   nav            — path_to/has_path/stop (GolemRandomStrollInVillageGoal navigation)
capabilities = ["entities.read", "entities.write", "world.read", "nav"]
